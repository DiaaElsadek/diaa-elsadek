<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051210"/>
      <stop offset="50%" stop-color="#09201b"/>
      <stop offset="100%" stop-color="#040d0c"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d2420" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#071714" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Glowing Radial Accent -->
  <circle cx="600" cy="220" r="350" fill="#059669" opacity="0.12" filter="blur(80px)"/>

  <!-- UI Window Container -->
  <rect x="120" y="80" width="960" height="515" rx="16" fill="url(#cardBg)" stroke="#134e40" stroke-width="1.5"/>
  
  <!-- Window Header Bar -->
  <path d="M120 96C120 87.1634 127.163 80 136 80H1064C1072.84 80 1080 87.1634 1080 96V125H120V96Z" fill="#0b1f1b" stroke="#134e40" stroke-width="1"/>
  <circle cx="150" cy="102" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="168" cy="102" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="186" cy="102" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="420" y="92" width="360" height="22" rx="6" fill="#134e40" opacity="0.6"/>
  <text x="600" y="107" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="500">al-anis.vercel.app — Healthcare &amp; Companionship Marketplace</text>

  <!-- Navigation Mock -->
  <rect x="150" y="145" width="900" height="50" rx="10" fill="#071916" stroke="#134e40" stroke-width="1"/>
  <text x="210" y="176" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">الأنيس | Al-Anis</text>
  <rect x="850" y="157" width="90" height="26" rx="6" fill="#059669"/>
  <text x="895" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">طلب رعاية</text>
  <rect x="740" y="157" width="95" height="26" rx="6" fill="#134e40"/>
  <text x="787" y="174" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">مقدمي الرعاية</text>

  <!-- Hero Content Area -->
  <text x="600" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="-0.02em">منصة الرعاية التمريضية والرفقة المنزلية الموثوقة</text>
  <text x="600" y="272" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">خدمات تمريضية ورعاية كبار السن مع تحديد دقيق للمناوبات ونظام محادثة فوري</text>

  <!-- Feature Grid Mock inside window -->
  <g transform="translate(150, 310)">
    <!-- Card 1: 3-Role State Machine -->
    <rect x="0" y="0" width="280" height="155" rx="10" fill="#071916" stroke="#134e40" stroke-width="1"/>
    <circle cx="36" cy="36" r="18" fill="#064e3b" opacity="0.6"/>
    <text x="36" y="41" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">R</text>
    <text x="24" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">3-Role RBAC State Machine</text>
    <text x="24" y="103" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Patient, Caregiver, and Admin portals with formal booking state verification.</text>
    <rect x="24" y="125" width="80" height="18" rx="4" fill="#134e40"/>
    <text x="64" y="137" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Verified States</text>

    <!-- Card 2: Shift Calculation Logic -->
    <rect x="310" y="0" width="280" height="155" rx="10" fill="#071916" stroke="#134e40" stroke-width="1"/>
    <circle cx="346" cy="36" r="18" fill="#065f46" opacity="0.6"/>
    <text x="346" y="41" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">S</text>
    <text x="334" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Configurable Shifts</text>
    <text x="334" y="103" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">8h daytime, 12h overnight, and 24h continuous shifts with automated pricing.</text>
    <rect x="334" y="125" width="85" height="18" rx="4" fill="#134e40"/>
    <text x="376" y="137" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Dynamic Matrix</text>

    <!-- Card 3: SignalR Real-Time Chat -->
    <rect x="620" y="0" width="280" height="155" rx="10" fill="#071916" stroke="#134e40" stroke-width="1"/>
    <circle cx="656" cy="36" r="18" fill="#1e3a8a" opacity="0.6"/>
    <text x="656" y="41" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">C</text>
    <text x="644" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">SignalR Real-Time Chat</text>
    <text x="644" y="103" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Low-latency bidirectional WebSocket messaging between families and nurses.</text>
    <rect x="644" y="125" width="85" height="18" rx="4" fill="#1e3a8a" opacity="0.6"/>
    <text x="686" y="137" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">WebSocket Hub</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(150, 505)">
    <rect x="0" y="0" width="110" height="26" rx="6" fill="#134e40" stroke="#059669" stroke-width="1"/>
    <text x="55" y="17" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">React (Vite)</text>

    <rect x="125" y="0" width="125" height="26" rx="6" fill="#134e40" stroke="#059669" stroke-width="1"/>
    <text x="187" y="17" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">ASP.NET Core C#</text>

    <rect x="265" y="0" width="105" height="26" rx="6" fill="#134e40" stroke="#059669" stroke-width="1"/>
    <text x="317" y="17" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">SQL Server</text>

    <rect x="385" y="0" width="115" height="26" rx="6" fill="#134e40" stroke="#059669" stroke-width="1"/>
    <text x="442" y="17" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">SignalR Hubs</text>

    <rect x="515" y="0" width="105" height="26" rx="6" fill="#134e40" stroke="#059669" stroke-width="1"/>
    <text x="567" y="17" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">Stripe Payments</text>

    <rect x="760" y="0" width="140" height="26" rx="6" fill="#047857" opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <circle cx="775" cy="13" r="3.5" fill="#10b981"/>
    <text x="835" y="17" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">GitHub + Live Site</text>
  </g>
</svg>
