  <text x="400" y="168" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">نظام جدولة فوري للملاعب (كرة قدم، بادل، كرة سلة، تنس) مع برنامج النقاط</text>

