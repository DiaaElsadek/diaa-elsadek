      <stop offset="0%" stop-color="#070908"/>
      <stop offset="100%" stop-color="#0c120e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#zBg)"/>
  <circle cx="400" cy="150" r="220" fill="#37d740" opacity="0.1" filter="blur(60px)"/>
  
  <rect x="60" y="50" width="680" height="350" rx="12" fill="#121614" stroke="#1f2c22" stroke-width="1.5"/>
