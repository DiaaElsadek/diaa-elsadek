    <text x="20" y="54" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Real-time availability schedule preventing booking overlaps.</text>
    <text x="20" y="80" fill="#37d740" font-family="monospace" font-size="9">Instant Checkout</text>

    <rect x="215" y="0" width="180" height="95" rx="8" fill="#171e19" stroke="#25382a"/>
    <text x="235" y="32" fill="#37d740" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Multi-Sport Directory</text>
    <text x="235" y="54" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Padel, Football, Tennis &amp; Basketball category pipelines.</text>
    <text x="235" y="80" fill="#37d740" font-family="monospace" font-size="9">4 Sport Categories</text>

    <rect x="430" y="0" width="180" height="95" rx="8" fill="#171e19" stroke="#25382a"/>
    <text x="450" y="32" fill="#37d740" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Points &amp; Rewards</text>
    <text x="450" y="54" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">10,000 Pt tier loyalty engine for frequent court bookings.</text>
    <text x="450" y="80" fill="#37d740" font-family="monospace" font-size="9">Loyalty Engine</text>
