<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#uBg)"/>
  <circle cx="400" cy="150" r="220" fill="#3b82f6" opacity="0.12" filter="blur(60px)"/>
  
  <rect x="60" y="50" width="680" height="350" rx="12" fill="#131c31" stroke="#1e2c4f" stroke-width="1.5"/>
  <path d="M60 62C60 55.3726 65.3726 50 72 50H728C734.627 50 740 55.3726 740 62V80H60V62Z" fill="#1a2542"/>
  <circle cx="80" cy="65" r="4" fill="#ef4444" opacity="0.7"/>
  <circle cx="95" cy="65" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="110" cy="65" r="4" fill="#10b981" opacity="0.7"/>
  <text x="400" y="70" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">uni-stream22.vercel.app — HTI Senior Academic Portal (Class 2026)</text>

  <!-- Content -->
  <text x="400" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">UniStream22 — البوابة الأكاديمية</text>
  <text x="400" y="168" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">منصة مركزية لطلاب حاسبات العاشر: جدول مخصص لمجموعتك، تنبيهات الأسبوع، وملاحظات دراسية</text>

  <!-- 3 Mini Cards -->
  <g transform="translate(90, 205)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="#18233d" stroke="#25375f"/>
    <text x="20" y="32" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Group Timetables</text>
    <text x="20" y="54" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Auto-generated schedules for section &amp; lab groups 1 to 6.</text>
    <text x="20" y="80" fill="#60a5fa" font-family="monospace" font-size="9">Dynamic Filters</text>

    <rect x="215" y="0" width="180" height="95" rx="8" fill="#18233d" stroke="#25375f"/>
    <text x="235" y="32" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Academic Feed</text>
    <text x="235" y="54" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Priority-flagged announcements, slides, and assignment deadlines.</text>
    <text x="235" y="80" fill="#60a5fa" font-family="monospace" font-size="9">Weekly Digests</text>

    <rect x="430" y="0" width="180" height="95" rx="8" fill="#18233d" stroke="#25375f"/>
    <text x="450" y="32" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PWA Offline Mode</text>
    <text x="450" y="54" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Installable web app providing reliable cached access across campus.</text>
    <text x="450" y="80" fill="#60a5fa" font-family="monospace" font-size="9">Service Worker</text>
  </g>

  <!-- Tags -->
  <g transform="translate(90, 340)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="#1e2c4f"/>
    <text x="40" y="15" fill="#93c5fd" font-family="monospace" font-size="10" text-anchor="middle">Next.js</text>
    <rect x="90" y="0" width="80" height="22" rx="4" fill="#1e2c4f"/>
    <text x="130" y="15" fill="#93c5fd" font-family="monospace" font-size="10" text-anchor="middle">PWA</text>
    <rect x="180" y="0" width="100" height="22" rx="4" fill="#1e2c4f"/>
    <text x="230" y="15" fill="#93c5fd" font-family="monospace" font-size="10" text-anchor="middle">Tailwind CSS</text>
  </g>
